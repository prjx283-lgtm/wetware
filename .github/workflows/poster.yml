# The poster, as a GitHub Actions job that feeds the worm every five minutes.
#
# GitHub's cron is not a clock: on this repo it fired every three to four
# hours and the worm missed six of eleven rounds in its first live session.
# So one job now runs for almost six hours, feeding every five minutes, then
# dispatches its successor and exits. The cron stays as a safety net that
# restarts the chain if it ever breaks. Every feeding restores the organism
# from the chain first, so no run can ever fork it.
#
# Secrets (Settings > Secrets and variables > Actions), set by a human:
#   POSTER_PRIVATE_KEY   signs postState
#   MIRROR_PRIVATE_KEY   testnet only: fills the MockAggregator
#   ALERT_WEBHOOK_URL or TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID   the gas alarm
#
# A low poster balance fails the run on purpose, so the failure notification
# and the red badge are the alarm even if no webhook is set.
name: poster

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      alarm_test:
        description: 'Fire the gas alarm on purpose to prove it reaches a human. The run fails by design.'
        type: boolean
        default: false

permissions:
  actions: write
  contents: read

concurrency:
  group: poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      RUN_ONCE: '1'
      NETWORK: ${{ vars.WETWARE_NETWORK || 'testnet' }}
      FEED: ${{ vars.WETWARE_FEED || 'NVDA' }}
      FEED_ADDRESS: ${{ vars.WETWARE_FEED_ADDRESS || '0x0D9858cAaeabbe85a82C57d47F43bb5B78199a1A' }}
      STATE_ADDRESS: ${{ vars.WETWARE_STATE_ADDRESS || '0x395E2b16354918e9aA3c9382E42E9de33Efb7EDe' }}
      FROM_BLOCK: ${{ vars.WETWARE_FROM_BLOCK || '114823883' }}
      GAS_ALARM_ETH: ${{ inputs.alarm_test && '1000' || vars.WETWARE_GAS_ALARM_ETH || '0.002' }}
      ALARM_TEST: ${{ inputs.alarm_test && '1' || '' }}
      ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev && cd packages/core && npm ci --omit=dev

      - name: feed the worm every five minutes for the life of this job
        env:
          MIRROR_PRIVATE_KEY: ${{ secrets.MIRROR_PRIVATE_KEY }}
          POSTER_PRIVATE_KEY: ${{ secrets.POSTER_PRIVATE_KEY }}
          STEP_MS: '20000'
          # An alarm test is a single feeding, not a six-hour job.
          ITERATIONS: ${{ inputs.alarm_test && '1' || '69' }}
        run: |
          alarm=0
          for i in $(seq 1 "$ITERATIONS"); do
            echo "::group::feeding $i of $ITERATIONS, $(date -u +%H:%M:%SZ)"
            if [ "$NETWORK" = "testnet" ]; then npm run mirror || echo "[mirror] failed this round, will retry"; fi
            npm run poster; code=$?
            if [ "$code" = "2" ]; then alarm=1; fi
            if [ "$code" != "0" ] && [ "$code" != "2" ]; then echo "[wetware] poster exited $code, will retry"; fi
            echo "::endgroup::"
            [ "$i" -lt "$ITERATIONS" ] && sleep 300
          done
          if [ "$alarm" = "1" ]; then echo "::error::gas alarm was raised during this job"; exit 2; fi

      - name: hand over to the next job
        if: always() && inputs.alarm_test != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run poster.yml --repo "$GITHUB_REPOSITORY"
